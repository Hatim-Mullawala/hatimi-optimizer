<!DOCTYPE html>
<html lang="en">
<head>
    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://img.icons8.com/color/192/circular-saw.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/circular-saw.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hatimi Cut">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hatimi Hardware | QuickCut</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --gold: #b38b2d; --dark: #1a1a1a; --gray: #f8f8f8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background: #eee; margin: 0; padding: 0; color: var(--dark); }
        .dashboard { width: 100%; max-width: 500px; margin: auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--dark); color: white; padding: 20px; border-bottom: 4px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase; }
        header h1 span { color: var(--gold); }
        .content { padding: 15px; flex-grow: 1; padding-bottom: 80px; }
        .section { background: var(--gray); padding: 20px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 15px; }
        h3 { margin-top: 0; font-size: 0.8rem; text-transform: uppercase; color: #888; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 15px; font-weight: 800; }
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; color: #555; }
        select, input { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; font-family: inherit; background: white; }
        .stock-row { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
        .req-row { display: grid; grid-template-columns: 1fr 70px 90px; gap: 8px; margin-bottom: 12px; }
        .unit-toggle { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--gold); height: 50px; background: white; }
        .unit-btn { flex: 1; border: none; background: #fff; font-size: 0.7rem; font-weight: 800; color: var(--gold); cursor: pointer; }
        .unit-btn.active { background: var(--gold); color: white; }
        .btn { border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; width: 100%; font-family: inherit; }
        .btn-add { background: white; color: var(--gold); border: 2px solid var(--gold); margin-top: 5px; }
        .btn-calc { background: var(--gold); color: white; font-size: 1.1rem; border-radius: 0; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        
        .results-wrap { padding: 5px 0; background: #fff; }
        .card { border: 1px solid #eee; padding: 20px; text-align: center; border-radius: 12px; background: #fafafa; border-top: 6px solid var(--gold); margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card .pick { font-size: 2.2rem; font-weight: 900; margin: 5px 0; color: var(--dark); }
        .card .cut-line { font-size: 1.2rem; color: #333; margin: 15px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 12px 0; }
        .card .cut-line b { color: var(--gold); font-size: 1.4rem; }
        .card .status { font-size: 0.8rem; margin-top: 10px; font-weight: 700; display: flex; justify-content: space-between; }

        .btn-print { background: #333 !important; color: #fff !important; border-radius: 12px !important; padding: 16px !important; margin: 20px 0 !important; width: 100%; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .print-header { display: none; }
        .screen-only { font-size: 0.8rem; text-transform: uppercase; color: #888; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 15px; font-weight: 800; }
/* Styling for the Total Size Summary */
        .summary-card { background: var(--dark); color: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; border-left: 6px solid var(--gold); }
        .summary-card p { margin: 0; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #bbb; }
        .summary-card .total-val { font-size: 1.8rem; font-weight: 900; color: white; margin-top: 4px; }
        .summary-card .total-val span { color: var(--gold); }
       /* Direct Print: A4 Page with 4x6 Slip Box */
@media print {
    @page { size: A4 portrait; margin: 0; }
    header, .section, button, .btn-calc, .no-print-zone, .screen-only { display: none !important; }
    body, .dashboard, .content { background: white !important; margin: 0 !important; padding: 0 !important; width: 210mm !important; max-width: 210mm !important; }
    
    /* 4x6 Slip Box inside A4 (Use margin: 2mm auto for Center Tray, or margin: 2mm 0 for Side Tray) */
    .print-header, .cards-grid { width: 98mm !important; margin-left: auto !important; margin-right: auto !important; }
    
    .print-header { display: block !important; text-align: center; padding-top: 3mm; margin-bottom: 6px !important; }
    .print-header h2 { font-size: 15pt; margin: 0; color: black; }
    
    .cards-grid { display: grid !important; grid-template-columns: repeat(2, 1fr); gap: 4px; }
    .cards-grid.pipes-1, .cards-grid.pipes-2 { grid-template-columns: 1fr; }
    .cards-grid.pipes-3 .card:first-child { grid-column: span 2; }
    
    .card { border: 2px solid black !important; padding: 4px !important; background: white !important; page-break-inside: avoid; border-radius: 0 !important; box-shadow: none !important; margin-bottom: 0 !important; }
    .card .pick { font-size: 15pt !important; line-height: 1; color: black !important; }
    .card .cut-line { font-size: 10pt !important; border-top: 1px solid black !important; border-bottom: 1px solid black !important; margin: 3px 0 !important; padding: 2px 0 !important; color: black !important; }
    .card .cut-line b { color: black !important; font-size: 11pt !important; }
    .card .status { font-size: 7pt !important; color: black !important; }
}

/* Share PDF: A4 Canvas with 4x6 Slip Box */
#results.pdf-export { width: 210mm !important; background: white !important; padding-top: 3mm !important; }
.pdf-export .screen-only { display: none !important; }

/* Use margin-left/right: auto for Center-Loading Printer, or 0 for Left-Edge Printer */
.pdf-export .print-header, .pdf-export .cards-grid { width: 98mm !important; margin-left: auto !important; margin-right: auto !important; }

.pdf-export .print-header { display: block !important; text-align: center; margin-bottom: 6px !important; }
.pdf-export .print-header h2 { font-size: 15pt; margin: 0; color: black; }
.pdf-export .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.pdf-export .cards-grid.pipes-1, .pdf-export .cards-grid.pipes-2 { grid-template-columns: 1fr; }
.pdf-export .cards-grid.pipes-3 .card:first-child { grid-column: span 2; }
.pdf-export .card { border: 2px solid black !important; padding: 4px !important; background: white !important; border-radius: 0 !important; box-shadow: none !important; margin-bottom: 0 !important; page-break-inside: avoid; }
.pdf-export .card .pick { font-size: 15pt !important; line-height: 1; color: black !important; }
.pdf-export .card .cut-line { font-size: 10pt !important; border-top: 1px solid black !important; border-bottom: 1px solid black !important; margin: 3px 0 !important; padding: 2px 0 !important; color: black !important; }
.pdf-export .card .cut-line b { color: black !important; font-size: 11pt !important; }
.pdf-export .card .status { font-size: 7pt !important; color: black !important; }
    </style>
</head>
<body>
<div class="dashboard">
    <header><h1>HATIMI <span>HARDWARE</span></h1></header>
    <div class="content">
        <div class="section">
            <h3>1. Inventory Stock</h3>
            <select id="cat" onchange="toggleStock()">
                <option value="1h">1" Heavy Duty (12,15,20ft)</option>
                <option value="1l">1" Light Duty (12ft)</option>
                <option value="1c">1" Color Coated (12ft)</option>
                <option value="34h">3/4" Heavy Duty (12ft)</option>
                <option value="34l">3/4" Light Duty (12ft)</option>
            </select>
            <div class="stock-row" style="margin-top:15px;"><span>12ft:</span><input type="number" id="s12" value="10"></div>
            <div id="ex_fields">
                <div class="stock-row"><span>15ft:</span><input type="number" id="s15" value="5"></div>
                <div class="stock-row"><span>20ft:</span><input type="number" id="s20" value="5"></div>
            </div>
        </div>
        <div class="section">
            <h3>2. Shop Scraps</h3>
            <div id="scraps"><input type="number" class="sc" placeholder="Ex: 84"></div>
            <button class="btn btn-add" onclick="addScrap()">+ Add Another Scrap</button>
        </div>
        <div class="section">
            <h3>3. Requirements</h3>
            <div id="needs">
                <div class="req-row">
                    <input type="number" class="sz" placeholder="Size">
                    <input type="number" class="qty" value="1">
                    <div class="unit-toggle" data-unit="in">
                        <button class="unit-btn active" onclick="setUnit(this, 'in')">IN</button>
                        <button class="unit-btn" onclick="setUnit(this, 'ft')">FT</button>
                    </div>
                </div>
            </div>
            <button class="btn btn-add" onclick="addNeed()">+ Add New Size</button>
        </div>
       <div class="no-print-zone">
    <button id="shareBtn" class="btn btn-print" onclick="sharePlan()">📲 SHARE / PRINT CUTTING PLAN</button>
</div>
        <div id="results" class="results-wrap"></div>
    </div>
    <button class="btn btn-calc" onclick="calc()">Calculate Cutting Plan</button>
</div>

<script>
    function toggleStock() { document.getElementById('ex_fields').style.display = document.getElementById('cat').value === '1h' ? 'block' : 'none'; }
    function addScrap() { const i = document.createElement('input'); i.className='sc'; i.type='number'; i.placeholder="Inches"; i.style.marginTop="10px"; document.getElementById('scraps').appendChild(i); }
    function setUnit(btn, unit) { Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active')); btn.classList.add('active'); btn.parentElement.dataset.unit = unit; }
    function addNeed() { const d = document.createElement('div'); d.className='req-row'; d.innerHTML = `<input type="number" class="sz" placeholder="Size"><input type="number" class="qty" value="1"><div class="unit-toggle" data-unit="in"><button class="unit-btn active" onclick="setUnit(this, 'in')">IN</button><button class="unit-btn" onclick="setUnit(this, 'ft')">FT</button></div>`; document.getElementById('needs').appendChild(d); }
    
    function findPerfect(target, currentNeeds) {
        let best = null;
        function search(rem, cuts, start) {
            if (rem === 0) { best = [...cuts]; return true; }
            for (let i = start; i < currentNeeds.length; i++) {
                if (currentNeeds[i] <= rem) if (search(rem - currentNeeds[i], [...cuts, currentNeeds[i]], i + 1)) return true;
            }
            return false;
        }
        search(target, [], 0); return best;
    }

    function calc() {
    const res = document.getElementById('results');
    const cat = document.getElementById('cat').value;
    let stock = { 
        144: parseInt(document.getElementById('s12').value)||0, 
        180: (cat==='1h'?parseInt(document.getElementById('s15').value)||0:0), 
        240: (cat==='1h'?parseInt(document.getElementById('s20').value)||0:0) 
    };
    let scrap = Array.from(document.getElementsByClassName('sc')).map(i=>parseFloat(i.value)).filter(v=>v>0);
    let req = [];
    Array.from(document.getElementsByClassName('req-row')).forEach(row => {
        let val = parseFloat(row.querySelector('.sz').value), q = parseInt(row.querySelector('.qty').value), unit = row.querySelector('.unit-toggle').dataset.unit;
        if(val > 0) { let sz = (unit === 'ft') ? val * 12 : val; while(q--) req.push(sz); }
    });
    req.sort((a,b)=>b-a);
    let plan = [];
    
    // Core Rule: Leftovers must be up to 5" (trash) OR 36"+ (reusable/salable scrap)
    const safe = (r) => (r <= 5 || r >= 36);

    // STEP 1: ZERO WASTE FRESH PIPES FIRST
    let freshSizes = Object.keys(stock).map(Number).sort((a,b)=>a-b);
    let pipesUsed = true;
    while (pipesUsed) {
        pipesUsed = false;
        let bestMatch = null;
        for (let p of freshSizes) {
            if (stock[p] > 0) {
                let comb = findPerfect(p, req);
                if (comb) {
                    if (!bestMatch || p > bestMatch.o) {
                        bestMatch = { o: p, c: comb };
                    }
                }
            }
        }
        if (bestMatch) {
            plan.push({ t: (bestMatch.o / 12) + 'FT PIPE', o: bestMatch.o, c: bestMatch.c, r: 0, s: true });
            bestMatch.c.forEach(v => req.splice(req.indexOf(v), 1)); stock[bestMatch.o]--;
            pipesUsed = true;
        }
    }

    // STEP 2: USE SHOP SCRAPS
    scrap.sort((a, b) => a - b); 
    for (let i = 0; i < scrap.length; i++) {
        let sVal = scrap[i];
        let bestComb = findPerfect(sVal, req); 
        if (!bestComb) {
            let tempCuts = [], rem = sVal, trq = [...req];
            for (let j = 0; j < trq.length; j++) {
                if (trq[j] <= rem) {
                    let potentialWaste = rem - trq[j];
                    if (safe(potentialWaste)) { rem -= trq[j]; tempCuts.push(trq[j]); trq.splice(j, 1); j--; }
                }
            }
            if (tempCuts.length > 0) bestComb = tempCuts;
        }
        if (bestComb) {
            let finalWaste = sVal - bestComb.reduce((a, b) => a + b, 0);
            plan.push({ t: 'OLD SCRAP', o: sVal, c: bestComb, r: finalWaste, s: true });
            bestComb.forEach(v => req.splice(req.indexOf(v), 1)); scrap.splice(i, 1); i--;
        }
    }

    // STEP 3: REMAINING FRESH PIPES (Strict Remnant Verification)
    while(req.length > 0){
        let best = null;
        let av = freshSizes.filter(s => stock[s] > 0).sort((a, b) => a - b);
        if(!av.length) break;
        
        for(let p of av) {
            let trq = [...req], c = [], r = p;
            for(let j=0; j<trq.length; j++){ 
                if(trq[j] <= r){ 
                    let potentialWaste = r - trq[j];
                    
                    // If adding this cut leaves an unsafe dead-zone piece (e.g. 32"), 
                    // AND we still have a long profile section remaining, skip this combination.
                    if (potentialWaste > 5 && potentialWaste < 36 && r === p) continue;
                    
                    r -= trq[j]; 
                    c.push(trq[j]); 
                    trq.splice(j,1); 
                    j--; 
                } 
            }
            
            if(c.length > 0) {
                // Rate combinations: Prefer configurations that pass the safety guidelines natively
                let score = c.length * 1000 - r; 
                if (safe(r)) score += 5000; 

                if(!best || score > best.score) {
                    best = {o: p, c: c, r: r, s: safe(r), score: score};
                }
            }
        }
        
        if(best) {
            plan.push({t:(best.o/12)+'FT PIPE', o:best.o, c:best.c, r:best.r, s:best.s});
            best.c.forEach(v => req.splice(req.indexOf(v),1)); stock[best.o]--;
        } else break;
    }

    // --- CALCULATE TOTAL SUM OF ALL CUT PIPES + WASTAGE IN FEET ---
    let totalInchesCut = 0;
    let totalWasteCharged = 0;

    plan.forEach(p => {
        let currentCardSum = p.c.reduce((a, b) => a + b, 0);
        // If leftover is under 36", it can't be sold later, so add to customer's total
        let chargeableWaste = (p.r < 36) ? p.r : 0; 
        
        totalInchesCut += (currentCardSum + chargeableWaste);
        totalWasteCharged += chargeableWaste;
    });
    let totalFeetCut = (totalInchesCut / 12).toFixed(2);
// --- RENDER ---
    let outputHtml = `<div class="print-header"><h2>HATIMI HARDWARE</h2></div><h3 class="screen-only">Results</h3>`;
    
    if(plan.length > 0) {
        outputHtml += `
        <div class="summary-card screen-only">
            <p>Total Billable Size (Includes ${totalWasteCharged}" Waste)</p>
            <div class="total-val">${totalFeetCut} <span>FT</span> <span style="font-size:1rem; color:#bbb;">(${totalInchesCut}")</span></div>
        </div>`;
    }

    outputHtml += `<div class="cards-grid pipes-${plan.length}">`;
    plan.forEach(p => {
        outputHtml += `<div class="card"><span class="type">${p.t}</span><div class="pick">${p.o}"</div><div class="cut-line">Cut: <b>${p.c.join('" + ')}"</b></div><div class="status"><span style="color:${p.s ? 'var(--gold)' : 'red'}">${p.s ? 'SAFE' : 'CHARGE FULL'}</span><span>Waste: ${p.r}"</span></div></div>`;
    });
    outputHtml += `</div>`;

    res.innerHTML = outputHtml; 
    res.scrollIntoView({ behavior: 'smooth' });
}

async function sharePlan() {
    const res = document.getElementById('results');
    const btn = document.getElementById('shareBtn');
    if (!res.querySelector('.card')) {
        alert('Please calculate a cutting plan first!');
        return;
    }

    btn.innerText = '⏳ PREPARING PDF...';
    res.classList.add('pdf-export');

   const opt = {
        margin: 0,
        filename: 'Hatimi-Cutting-Plan.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } // A4 sheet with 4x6 slip inside
    };

    try {
        const pdfBlob = await html2pdf().set(opt).from(res).output('blob');
        res.classList.remove('pdf-export');
        btn.innerText = '📲 SHARE / PRINT CUTTING PLAN';

        const file = new File([pdfBlob], 'Hatimi-Cutting-Plan.pdf', { type: 'application/pdf' });

        // Opens native mobile Share Sheet (Print, Open as PDF, WhatsApp, Drive, etc.)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
                title: 'Hatimi Hardware - Cutting Plan',
                files: [file]
            });
        } else {
            // Fallback for desktop browsers: opens PDF directly in a new tab to print/save
            const pdfUrl = URL.createObjectURL(pdfBlob);
            window.open(pdfUrl, '_blank');
        }
    } catch (err) {
        res.classList.remove('pdf-export');
        btn.innerText = '📲 SHARE / PRINT CUTTING PLAN';
    }
}
</script>
</body>
</html>
