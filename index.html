<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="192x192" href="https://img.icons8.com/color/192/circular-saw.png">
<link rel="apple-touch-icon" href="https://img.icons8.com/color/192/circular-saw.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hatimi Cut">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hatimi Hardware | QuickCut</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #b38b2d; --dark: #1a1a1a; --gray: #f8f8f8; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background: #eee; margin: 0; padding: 0; color: var(--dark); }
        
        .dashboard { width: 100%; max-width: 500px; margin: auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background: var(--dark); color: white; padding: 20px; border-bottom: 4px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase; }
        header h1 span { color: var(--gold); }
        
        .content { padding: 15px; flex-grow: 1; padding-bottom: 80px; }
        
        .section { background: var(--gray); padding: 20px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 15px; }
        h3 { margin-top: 0; font-size: 0.8rem; text-transform: uppercase; color: #888; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 15px; font-weight: 800; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; color: #555; }
        
        select, input { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; font-family: inherit; background: white; }
        
        .stock-row { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
        .stock-row span { font-weight: 800; font-size: 0.9rem; }

        .req-row { display: grid; grid-template-columns: 1fr 70px 90px; gap: 8px; margin-bottom: 12px; }
        .unit-toggle { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid var(--gold); height: 50px; background: white; }
        .unit-btn { flex: 1; border: none; background: #fff; font-size: 0.7rem; font-weight: 800; color: var(--gold); cursor: pointer; }
        .unit-btn.active { background: var(--gold); color: white; }

        .btn { border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; width: 100%; font-family: inherit; }
        .btn-add { background: white; color: var(--gold); border: 2px solid var(--gold); margin-top: 5px; }
        .btn-calc { 
            background: var(--gold); 
            color: white; 
            font-size: 1.1rem; 
            border-radius: 0; 
            position: fixed; 
            bottom: 0; 
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1); 
        }
        
        .results-wrap { padding: 5px 0; background: #fff; }
        .card { border: 1px solid #eee; padding: 20px; text-align: center; border-radius: 12px; background: #fafafa; border-top: 6px solid var(--gold); margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card .type { font-size: 0.7rem; font-weight: 900; color: #999; text-transform: uppercase; margin-bottom: 5px; display: block;}
        .card .pick { font-size: 2.2rem; font-weight: 900; margin: 5px 0; color: var(--dark); }
        .card .cut-line { font-size: 1.2rem; color: #333; margin: 15px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 12px 0; }
        .card .cut-line b { color: var(--gold); font-size: 1.4rem; }
      @media print {
    @page { size: 4in 6in; margin: 3mm; }
    
    /* Hide everything except results */
    header, .section, button, .btn-calc, .btn-print, .no-print-zone, .results-title { 
        display: none !important; 
    }

    .dashboard { width: 100%; min-height: auto; margin: 0; padding: 0; }
    
    .print-header { display: block !important; text-align: center; margin-bottom: 8px; }
    .print-header h2 { font-size: 14pt; font-weight: 900; margin: 0; color: black; }

    /* The Grid Container */
    #results {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr); /* Default to 2 columns */
        gap: 5px;
        width: 100%;
    }

    /* Logic for different pipe counts */
    /* If only 1 pipe, make it full width */
    #results:has(.card:nth-child(1):last-child) { grid-template-columns: 1fr; }
    
    /* If only 2 pipes, make them full width stacked */
    #results:has(.card:nth-child(2):last-child) { grid-template-columns: 1fr; }

    /* If 3 pipes: first one is full width, next two are side-by-side */
    #results:has(.card:nth-child(3):last-child) .card:first-child {
        grid-column: span 2;
    }

    .card { 
        border: 2px solid black !important; 
        padding: 5px !important; 
        background: white !important;
        display: flex;
        flex-direction: column;
        justify-content: center;
        page-break-inside: avoid;
    }

    .card .type { font-size: 7pt; font-weight: bold; color: black; }
    .card .pick { font-size: 16pt; font-weight: 900; color: black; margin: 0; line-height: 1; }
    .card .cut-line { 
        font-size: 10pt; 
        border-top: 1px solid black; 
        border-bottom: 1px solid black; 
        margin: 4px 0; 
        padding: 2px 0;
        font-weight: bold;
        color: black;
    }
    .card .status { font-size: 7pt; display: flex; justify-content: space-between; color: black; }
}
/* Styling the Results Header on Screen */
.print-header {
    text-align: center;
    padding: 20px 0;
    margin-bottom: 20px;
    border-bottom: 1px solid #eee;
}

.print-header h2 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    letter-spacing: 2px;
    margin: 0;
    color: var(--dark);
    font-size: 1.5rem;
}

.print-header p {
    font-size: 0.7rem;
    color: #888;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Restoring the "Calculation Results" Heading */
.screen-only-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    color: #888;
    border-bottom: 1px solid #ddd;
    padding-bottom: 8px;
    margin-bottom: 15px;
    font-weight: 800;
}
.btn-print {
    background: #333 !important;
    color: #fff !important;
    border: none !important;
    padding: 16px !important;
    margin: 20px 0 !important;
    border-radius: 12px !important;
    font-size: 0.9rem !important;
    font-weight: 700 !important;
    text-transform: uppercase;
    letter-spacing: 1px !important;
    display: flex !important;
    align-items: center;
    justify-content: center;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.btn-print:active {
    transform: scale(0.96);
    background: #000 !important;
}
/* Hide the extra header on the app screen */
.print-header { display: none; }

/* Show it only when printing */
@media print {
    .print-header { display: block !important; }
}
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>HATIMI <span>HARDWARE</span></h1>
    </header>

    <div class="content">
        <div class="section">
            <h3>1. Inventory Stock</h3>
            <div class="input-group">
                <label>Category</label>
                <select id="cat" onchange="toggleStock()">
                    <option value="1h">1" Heavy Duty (12,15,20ft)</option>
                    <option value="1l">1" Light Duty (12ft)</option>
                    <option value="1c">1" Color Coated (12ft)</option>
                    <option value="34h">3/4" Heavy Duty (12ft)</option>
                    <option value="34l">3/4" Light Duty (12ft)</option>
                </select>
            </div>
            
            <div class="stock-row"><span>12ft:</span><input type="number" id="s12" value="10"></div>
            <div id="ex_fields">
                <div class="stock-row"><span>15ft:</span><input type="number" id="s15" value="5"></div>
                <div class="stock-row"><span>20ft:</span><input type="number" id="s20" value="5"></div>
            </div>
        </div>

        <div class="section">
            <h3>2. Shop Scraps (Inches)</h3>
            <div id="scraps">
                <input type="number" class="sc" placeholder="Ex: 84">
            </div>
            <button class="btn btn-add" onclick="addScrap()">+ Add Another Scrap</button>
        </div>

        <div class="section">
            <h3>3. Requirements</h3>
            <div id="needs">
                <div class="req-row">
                    <input type="number" class="sz" placeholder="Size">
                    <input type="number" class="qty" value="1">
                    <div class="unit-toggle" data-unit="in">
                        <button class="unit-btn active" onclick="setUnit(this, 'in')">IN</button>
                        <button class="unit-btn" onclick="setUnit(this, 'ft')">FT</button>
                    </div>
                </div>
            </div>
            <button class="btn btn-add" onclick="addNeed()">+ Add New Size</button>
        </div>
<div class="no-print-zone">
    <button class="btn btn-print" onclick="window.print()">
        <span style="margin-right: 8px;">🖨️</span> PRINT CUTTING PLAN
    </button>
</div>
        <div id="results" class="results-wrap"></div>
    </div>

    <button class="btn btn-calc" onclick="calc()">Calculate Cutting Plan</button>
</div>

<script>
    function toggleStock() {
        const isH = document.getElementById('cat').value === '1h';
        document.getElementById('ex_fields').style.display = isH ? 'block' : 'none';
    }

    function addScrap() { 
        const i = document.createElement('input'); 
        i.className='sc'; i.type='number'; i.placeholder="Inches"; i.style.marginTop="10px";
        document.getElementById('scraps').appendChild(i); 
    }
    
    function setUnit(btn, unit) {
        const parent = btn.parentElement;
        Array.from(parent.children).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        parent.dataset.unit = unit;
    }

    function addNeed() { 
        const d = document.createElement('div'); d.className='req-row';
        d.innerHTML = `
            <input type="number" class="sz" placeholder="Size">
            <input type="number" class="qty" value="1">
            <div class="unit-toggle" data-unit="in">
                <button class="unit-btn active" onclick="setUnit(this, 'in')">IN</button>
                <button class="unit-btn" onclick="setUnit(this, 'ft')">FT</button>
            </div>`;
        document.getElementById('needs').appendChild(d);
    }

    function findPerfect(target, currentNeeds) {
        let best = null;
        function search(rem, cuts, start) {
            if (rem === 0) { best = [...cuts]; return true; }
            for (let i = start; i < currentNeeds.length; i++) {
                if (currentNeeds[i] <= rem) if (search(rem - currentNeeds[i], [...cuts, currentNeeds[i]], i + 1)) return true;
            }
            return false;
        }
        search(target, [], 0); 
        return best;
    }
function calc() {
        const res = document.getElementById('results');
        const cat = document.getElementById('cat').value;
        
        let stock = { 
            144: parseInt(document.getElementById('s12').value)||0, 
            180: (cat==='1h'?parseInt(document.getElementById('s15').value)||0:0), 
            240: (cat==='1h'?parseInt(document.getElementById('s20').value)||0:0) 
        };
        
        let scrap = Array.from(document.getElementsByClassName('sc')).map(i=>parseFloat(i.value)).filter(v=>v>0);
        let req = [];
        Array.from(document.getElementsByClassName('req-row')).forEach(row => {
            let val = parseFloat(row.querySelector('.sz').value), 
                q = parseInt(row.querySelector('.qty').value), 
                unit = row.querySelector('.unit-toggle').dataset.unit;
            if(val > 0) { let sz = (unit === 'ft') ? val * 12 : val; while(q--) req.push(sz); }
        });
        req.sort((a,b)=>b-a);

        let plan = [];
        const safe = (r) => (r <= 4 || r >= 36);

        for (let i = 0; i < scrap.length; i++) {
            let comb = findPerfect(scrap[i], req);
            if (comb) { plan.push({t:'OLD SCRAP', o:scrap[i], c:comb, r:0, s:true}); comb.forEach(v => req.splice(req.indexOf(v), 1)); scrap.splice(i, 1); i--; }
        }

        let freshSizes = Object.keys(stock).map(Number).sort((a,b)=>b-a);
        while(req.length > 0){
            let best = null;
            let av = freshSizes.filter(s => stock[s] > 0).sort((a, b) => a - b);
            if(!av.length) break;

            for(let p of av) {
                let trq = [...req], c = [], r = p;
                for(let j=0; j<trq.length; j++){ 
                    if(trq[j] <= r){ 
                        let potentialWaste = r - trq[j];
                        if (potentialWaste > 0 && potentialWaste < 36 && r >= 36) continue; 
                        r -= trq[j]; c.push(trq[j]); trq.splice(j,1); j--; 
                    } 
                }
                if(!best || (r === 0 && best.r !== 0) || (safe(r) && !safe(best.r)) || (safe(r) && p < best.o)) {
                    best = {o: p, c: c, r: r, s: safe(r)};
                }
            }
            if(best) {
                plan.push({t:(best.o/12)+'FT PIPE', o:best.o, c:best.c, r:best.r, s:best.s});
                best.c.forEach(v => req.splice(req.indexOf(v),1)); 
                stock[best.o]--;
            } else break;
        }

        // --- RENDER (Optimized for space) ---
let outputHtml = `
    <div class="print-header">
        <h2>HATIMI HARDWARE</h2>
    </div>
    <h3 class="results-title screen-only">Results</h3>
`;

        plan.forEach(p => {
            outputHtml += `
            <div class="card">
                <span class="type">${p.t}</span>
                <div class="pick">${p.o}"</div>
                <div class="cut-line">Cut: <b>${p.c.join('" + ')}"</b></div>
                <div class="status">
                    <span style="color:${p.s ? 'var(--gold)' : 'red'}">${p.s ? 'SAFE' : 'CHARGE FULL'}</span>
                    <span>Waste: ${p.r}"</span>
                </div>
            </div>`;
        });

        res.innerHTML = outputHtml;
        res.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
