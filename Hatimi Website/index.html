<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatimi Hardware | Excellence in Fittings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --navy: #050c1a; --gold: #c29b40; }
        .bg-navy { background-color: var(--navy); }
        .text-gold { color: var(--gold); }
        .btn-premium { 
            background: linear-gradient(135deg, #c29b40 0%, #e5c17b 100%);
            color: var(--navy);
            transition: 0.4s;
        }
        .btn-premium:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="bg-white font-sans text-gray-900">

    <nav class="bg-white p-5 flex justify-between items-center sticky top-0 z-50 border-b border-gray-100">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-navy flex items-center justify-center text-gold font-serif italic text-xl">H</div>
            <span class="text-xl font-black tracking-tighter uppercase text-navy">Hatimi <span class="font-light">Hardware</span></span>
        </div>
        <div class="hidden md:flex space-x-10 text-[11px] font-bold uppercase tracking-widest text-gray-500">
            <a href="#home">Overview</a>
            <a href="shop.html" class="text-gold">Shop Online</a>
            <a href="#contact">Contact</a>
        </div>
        <a href="shop.html" class="btn-premium px-6 py-2 rounded text-[10px] font-black uppercase tracking-widest">Shopping</a>
    </nav>

    <header id="home" class="relative min-h-[90vh] flex items-center bg-navy text-white overflow-hidden px-6">
        <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-12 items-center relative z-10">
            <div>
                <h1 class="text-6xl md:text-8xl font-bold leading-none mb-8">Crafting <br><span class="text-gold italic font-serif">Luxury</span> Interiors.</h1>
                <p class="text-gray-400 text-lg md:text-xl font-light leading-relaxed mb-10 max-w-lg">
                    Distributing premium furniture fittings and industrial hand tools for architects, designers, and master craftsmen.
                </p>
                <div class="flex items-center space-x-6">
                    <a href="shop.html" class="btn-premium px-10 py-5 rounded font-bold text-xs uppercase tracking-[0.2em]">Start Shopping</a>
                    <span class="text-gold font-serif italic text-lg">Since 2010</span>
                </div>
            </div>
            <div class="hidden md:block relative">
                <div class="w-full h-[500px] bg-white/5 rounded-2xl border border-white/10 flex items-center justify-center text-gold/20 font-black text-9xl">H</div>
            </div>
        </div>
    </header>

</body>
</html>
